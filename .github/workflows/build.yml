name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TUN2PROXY_VERSION: v0.8.3
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact: Tun2ProxyGUI-windows-x86_64
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            artifact: Tun2ProxyGUI-linux-x86_64
          - os: macos-14
            platform: macos
            arch: aarch64
            artifact: Tun2ProxyGUI-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            zip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch tun2proxy binaries
        shell: bash
        env:
          TUN2PROXY_PLATFORM: ${{ matrix.platform }}
          TUN2PROXY_ARCH: ${{ matrix.arch }}
          TUN2PROXY_DOWNLOAD_PROXY: ""
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -ExecutionPolicy Bypass -File ./scripts/fetch_binaries.ps1
          else
            bash ./scripts/fetch_binaries.sh
          fi

      - name: Ensure icon
        run: python ./scripts/gen_icon.py

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'from app import __version__; print(__version__)')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          curl.exe -fsSL -o $installer 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          if (-not (Test-Path $installer) -or ((Get-Item $installer).Length -lt 1MB)) {
            throw "Inno Setup installer download failed or looks invalid: $installer"
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installing Inno Setup: $iscc"
          }
          "INNOSETUP_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/build_installer.ps1 -SkipBuild -Version "${{ steps.version.outputs.version }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Tun2ProxyGUI/* -DestinationPath "${{ matrix.artifact }}.zip" -Force
          $setupName = "Tun2ProxyGUI-Setup-${{ steps.version.outputs.version }}-windows-x86_64.exe"
          $setup = Join-Path 'dist' $setupName
          if (-not (Test-Path $setup)) {
            throw "Installer not found: $setup"
          }
          Copy-Item $setup -Destination $setupName

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          (
            cd dist
            zip -r "../${{ matrix.artifact }}.zip" Tun2ProxyGUI
          )

      - name: Upload portable zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: Tun2ProxyGUI-Setup-windows-x86_64
          path: Tun2ProxyGUI-Setup-*-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p upload
          find release-assets -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp -v {} upload/ \;
          ls -lah upload
          test -n "$(find upload -maxdepth 1 -type f -name '*.exe' | head -n 1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
